name: Automated End-of-Day Audit Archiver

on:
  schedule:
    # 10:05 UTC = 3:35 PM IST (Primary end-of-day run shortly after 3:30 PM closing bell)
    - cron: '05 10 * * 1-5'
    # 10:45 UTC = 4:15 PM IST (Single fallback trigger for queue delays)
    - cron: '45 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  archive-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Archive Market Audit Telemetry from Render
        run: |
          # Calculate current IST date (UTC + 5:30)
          TODAY=$(date -u -d '+5 hours 30 minutes' +'%Y-%m-%d')
          echo "📅 Running Archiver for IST Date: $TODAY"
          
          mkdir -p backend/data
          mkdir -p backend/data/archive
          
          echo "📡 Downloading Today's Signal Telemetry from Render..."
          HTTP_STATUS=$(curl -s -w "%{http_code}" --max-time 60 --retry 3 \
            "https://stock-trading-1-cquo.onrender.com/api/quant/signal-audit/download?range=today&format=json" \
            -o "/tmp/today_telemetry.json") || echo "⚠️ Warning: Signal telemetry fetch failed"
          
          echo "HTTP Response: $HTTP_STATUS"
          
          # Node script to validate downloaded telemetry and backfill without overwriting valid data
          node -e "
            const fs = require('fs');
            const path = '/tmp/today_telemetry.json';
            const today = '$TODAY';
            const targetPath = 'backend/data/signal_audit_' + today + '.json';
            const archivePath = 'backend/data/archive/signal_audit_' + today + '.json';

            if (fs.existsSync(path)) {
              try {
                const content = fs.readFileSync(path, 'utf8').trim();
                const data = JSON.parse(content);
                const entries = Array.isArray(data) ? data : (data.data || []);

                if (entries.length > 0) {
                  console.log('✅ Downloaded ' + entries.length + ' valid telemetry snapshots for ' + today);
                  fs.writeFileSync(targetPath, JSON.stringify(entries, null, 2));
                  fs.writeFileSync(archivePath, JSON.stringify(entries, null, 2));
                } else {
                  console.log('⚠️ Telemetry download returned 0 entries for ' + today + '. Skipping overwrite to protect historical records.');
                }
              } catch(e) {
                console.log('⚠️ Failed to parse downloaded telemetry JSON:', e.message);
              }
            }
          "

          echo "📜 Downloading Weekly Simulation Trade Ledger from Render..."
          curl -s --max-time 60 --retry 3 \
            "https://stock-trading-1-cquo.onrender.com/api/paper/weekly-audit/download?format=json" \
            -o "/tmp/weekly_audit.json" || echo "⚠️ Warning: Trade ledger fetch failed"

          node -e "
            const fs = require('fs');
            const path = '/tmp/weekly_audit.json';
            const targetPath = 'backend/data/weekly_simulation_log.json';

            if (fs.existsSync(path)) {
              try {
                const data = JSON.parse(fs.readFileSync(path, 'utf8'));
                if (data && (data.trades || data.weeklySummary)) {
                  fs.writeFileSync(targetPath, JSON.stringify(data, null, 2));
                  console.log('✅ Updated weekly simulation ledger successfully.');
                }
              } catch(e) {
                console.log('⚠️ Weekly audit parse skipped:', e.message);
              }
            }
          "

          echo "📦 Downloading Daily Stock P&L & Telemetry Bundle from Render..."
          curl -s --max-time 60 --retry 3 \
            "https://stock-trading-1-cquo.onrender.com/api/stocks/download-pnl-data" \
            -o "/tmp/stock_pnl_bundle.json" || echo "⚠️ Warning: Stock P&L fetch failed"

          node -e "
            const fs = require('fs');
            const path = '/tmp/stock_pnl_bundle.json';

            if (fs.existsSync(path)) {
              try {
                const bundle = JSON.parse(fs.readFileSync(path, 'utf8'));
                if (bundle && bundle.data) {
                  Object.entries(bundle.data).forEach(([filename, content]) => {
                    const dest = 'backend/data/' + filename;
                    fs.writeFileSync(dest, JSON.stringify(content, null, 2));
                    console.log('✅ Archived stock data file:', filename);
                  });
                }
              } catch(e) {
                console.log('⚠️ Stock P&L bundle parse skipped:', e.message);
              }
            }
          "

          echo "ℹ️ Audit archiving complete. Automated emails are handled strictly by the server at 3:30 PM IST."

      - name: Commit and Push Archived Logs to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add backend/data/*.json backend/data/archive/*.json
          
          if git diff --staged --quiet; then
            echo "ℹ️ No new audit records to commit (working tree already up to date)."
          else
            TODAY=$(date -u -d '+5 hours 30 minutes' +'%Y-%m-%d')
            git commit -m "Automated End-of-Day Audit Archive: $TODAY [skip ci]"
            git push origin HEAD:main
            git push origin HEAD:render-deployment
            echo "✅ Successfully archived and committed verified telemetry to GitHub!"
          fi
