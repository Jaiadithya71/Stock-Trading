name: Wake Up Render Server for Market Hours

on:
  schedule:
    # Runs at 03:20 UTC (8:50 AM IST) Monday through Friday
    - cron: '20 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  wake-server:
    runs-on: ubuntu-latest
    steps:
      - name: Send Warm-Up Probe to Render (90s Timeout)
        run: |
          echo "⏰ Sending pre-market warm-up request to Render..."
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\nTotal Time: %{time_total}s\n" \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            https://stock-trading-1-cquo.onrender.com/health
