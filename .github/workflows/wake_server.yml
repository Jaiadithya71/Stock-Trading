name: Wake Up & Keep Render Server Alive for Market & Archiving Hours

on:
  schedule:
    # Runs every 10 minutes between 03:00 UTC and 12:59 UTC (8:30 AM to 6:30 PM IST) Monday through Friday
    # Keeps the server and in-memory audit logs active continuously through market hours and all archival fallback triggers
    - cron: '*/10 3-12 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI / CLI anytime

jobs:
  wake-server:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Probe to Render (90s Timeout)
        run: |
          echo "⏰ Sending keep-alive / warm-up probe to Render..."
          echo "Target URL: https://stock-trading-1-cquo.onrender.com/health"
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            https://stock-trading-1-cquo.onrender.com/health)
          
          echo "=== RESPONSE FROM RENDER ==="
          echo "HTTP_CODE: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Keep-alive probe failed! Render server returned HTTP $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Render server is healthy, active, and running without idle sleep!"
