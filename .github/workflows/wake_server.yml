name: Wake Up Render Server for Market Hours

on:
  schedule:
    # Runs every 10 minutes from 03:20 UTC (8:50 AM IST) to 10:05 UTC (3:35 PM IST), Monday through Friday
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI / CLI anytime

jobs:
  wake-server:
    runs-on: ubuntu-latest
    steps:
      - name: Send Warm-Up Probe to Render (90s Timeout)
        run: |
          echo "⏰ Sending pre-market warm-up request to Render..."
          echo "Target URL: https://stock-trading-1-cquo.onrender.com/health"
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            https://stock-trading-1-cquo.onrender.com/health)
          
          echo "=== RESPONSE FROM RENDER ==="
          echo "HTTP_CODE: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Pre-market warm-up probe failed! Render server returned HTTP $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Render server is healthy, warm, and ready for market open!"
