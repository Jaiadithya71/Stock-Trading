name: Wake Up & Keep Render Server Alive for Market & Archiving Hours

on:
  schedule:
    # Runs every 10 minutes between 03:00 UTC and 12:59 UTC (8:30 AM to 6:30 PM IST) Monday through Friday
    # Keeps the server and in-memory audit logs active continuously through market hours and all archival fallback triggers
    - cron: '*/10 3-12 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI / CLI anytime

jobs:
  wake-server:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Probe to Render (Resilient Cold-Start Retry Loop)
        run: |
          echo "⏰ Sending keep-alive / warm-up probe to Render..."
          echo "Target URL: https://stock-trading-1-cquo.onrender.com/health"
          
          MAX_ATTEMPTS=5
          SUCCESS=false
          
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i of $MAX_ATTEMPTS: Probing Render /health (60s timeout)..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://stock-trading-1-cquo.onrender.com/health || echo "000")
            echo "Response: HTTP $HTTP_CODE"
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Render server is healthy, active, and returned HTTP 200 OK!"
              SUCCESS=true
              break
            elif [ "$HTTP_CODE" -eq 503 ] || [ "$HTTP_CODE" -eq 502 ] || [ "$HTTP_CODE" -eq 000 ]; then
              echo "⏳ Server is cold-booting/waking up from idle sleep (HTTP $HTTP_CODE). Waiting 20s for container initialization..."
              sleep 20
            else
              echo "⚠️ Response HTTP $HTTP_CODE. Retrying in 15s..."
              sleep 15
            fi
          done
          
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Keep-alive probe failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi
